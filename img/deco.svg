<svg xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="lg-red" cx="40%" cy="40%" r="70%">
      <stop offset="0" stop-color="#ff6a4d"/>
      <stop offset=".55" stop-color="#e0262f"/>
      <stop offset="1" stop-color="#9c0f1f"/>
    </radialGradient>
    <radialGradient id="lg-gold" cx="40%" cy="40%" r="70%">
      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset=".6" stop-color="#f6b93b"/>
      <stop offset="1" stop-color="#c77d0e"/>
    </radialGradient>
    <linearGradient id="lg-star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a3c"/>
      <stop offset="1" stop-color="#c8102e"/>
    </linearGradient>
  </defs>

  <!-- Round red lantern, viewBox 0 0 100 170 -->
  <symbol id="lantern" viewBox="0 0 100 170">
    <rect x="35" y="22" width="30" height="10" rx="3" fill="#f6b93b"/>
    <ellipse cx="50" cy="80" rx="44" ry="50" fill="url(#lg-red)"/>
    <g fill="none" stroke="#ffcf6b" stroke-opacity=".55" stroke-width="2">
      <ellipse cx="50" cy="80" rx="30" ry="50"/>
      <ellipse cx="50" cy="80" rx="14" ry="50"/>
      <line x1="50" y1="30" x2="50" y2="130"/>
    </g>
    <rect x="35" y="127" width="30" height="10" rx="3" fill="#f6b93b"/>
    <g stroke="#f6b93b" stroke-width="3" stroke-linecap="round">
      <line x1="42" y1="138" x2="40" y2="166"/>
      <line x1="50" y1="138" x2="50" y2="168"/>
      <line x1="58" y1="138" x2="60" y2="166"/>
    </g>
  </symbol>

  <!-- Golden round lantern -->
  <symbol id="lantern-gold" viewBox="0 0 100 170">
    <rect x="35" y="22" width="30" height="10" rx="3" fill="#c8102e"/>
    <ellipse cx="50" cy="80" rx="40" ry="48" fill="url(#lg-gold)"/>
    <g fill="none" stroke="#a8520a" stroke-opacity=".45" stroke-width="2">
      <ellipse cx="50" cy="80" rx="26" ry="48"/>
      <ellipse cx="50" cy="80" rx="11" ry="48"/>
    </g>
    <rect x="35" y="125" width="30" height="10" rx="3" fill="#c8102e"/>
    <g stroke="#c8102e" stroke-width="3" stroke-linecap="round">
      <line x1="44" y1="136" x2="42" y2="164"/>
      <line x1="50" y1="136" x2="50" y2="166"/>
      <line x1="56" y1="136" x2="58" y2="164"/>
    </g>
  </symbol>

  <!-- Đèn ông sao (five-point star lantern), viewBox 0 0 100 100 -->
  <symbol id="star" viewBox="0 0 100 100">
    <polygon points="50,4 61.8,36.2 96,36.2 68.3,56.4 79,90 50,69.6 21,90 31.7,56.4 4,36.2 38.2,36.2"
      fill="url(#lg-star)" stroke="#ffd34d" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="50,24 56,42 75,42 60,53 66,71 50,60 34,71 40,53 25,42 44,42" fill="#ffd34d" opacity=".9"/>
    <circle cx="50" cy="50" r="7" fill="#fff3c4"/>
  </symbol>
</svg>
